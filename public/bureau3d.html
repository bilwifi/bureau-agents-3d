<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau des agents 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --verre: rgba(16, 18, 30, .62); --bord: rgba(255,255,255,.12); --texte: #eef0f7; --doux: #9aa1b8; --vert: #4ff0a0; --orange: #ffb347; --rouge: #ff6b6b; --bleu: #7ab8ff; --claude: #e8845c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #07080d; color: var(--texte); font: 13px/1.45 "Space Grotesk", -apple-system, sans-serif; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; }
.verre { background: var(--verre); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid var(--bord); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
#hud { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; pointer-events: none; z-index: 5; }
#titre { padding: 10px 16px; pointer-events: auto; }
#titre h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .18em; }
#titre small { color: var(--doux); font-size: 11px; letter-spacing: .04em; }
.kpi { padding: 8px 14px; min-width: 112px; }
.kpi span { display: block; color: var(--doux); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
.kpi b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi.alerte { border-color: rgba(255,107,107,.7); box-shadow: 0 0 24px rgba(255,107,107,.35); animation: pouls 1.6s infinite; }
.kpi.alerte b { color: var(--rouge); }
@keyframes pouls { 50% { box-shadow: 0 0 6px rgba(255,107,107,.15); } }
#liens { margin-left: auto; padding: 10px 14px; pointer-events: auto; display: flex; gap: 12px; align-items: center; }
#liens a, #liens button { color: var(--texte); text-decoration: none; font: inherit; font-size: 12px; background: none; border: 0; cursor: pointer; opacity: .8; }
#liens a:hover, #liens button:hover { opacity: 1; }
#fil { position: fixed; left: 16px; bottom: 16px; width: min(520px, calc(100% - 32px)); max-height: 168px; overflow: hidden; padding: 10px 14px; z-index: 5; font: 12px/1.6 "JetBrains Mono", monospace; }
#fil div { color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: entre .5s ease; }
#fil b { color: var(--texte); font-weight: 600; }
@keyframes entre { from { opacity: 0; transform: translateY(6px); } }
#legende { position: fixed; right: 16px; bottom: 16px; padding: 10px 14px; z-index: 5; font-size: 11px; color: var(--doux); display: grid; grid-template-columns: auto auto; gap: 4px 14px; }
#legende i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; box-shadow: 0 0 8px currentColor; }
.ancre { width: 0; height: 0; pointer-events: none; }
.tige { position: absolute; left: 0; bottom: 0; width: 1px; height: 0; background: linear-gradient(to top, rgba(255,255,255,.15), rgba(255,255,255,.7)); }
.ancre::after { content: ''; position: absolute; left: -2px; bottom: -2px; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.55); opacity: var(--point, 0); }
.bulle { position: absolute; left: 0; bottom: 6px; width: max-content; font: 600 11px "Space Grotesk", sans-serif; color: #fff; padding: 4px 9px; border-radius: 10px; background: rgba(12,14,24,.82); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(6px); pointer-events: none; transition: opacity .3s; box-shadow: 0 4px 14px rgba(0,0,0,.3); max-width: 190px; will-change: transform; }
.bulle .b-tache { font-weight: 500; font-size: 10px; line-height: 1.3; color: rgba(255,255,255,.88); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 3px; }
.bulle .b-act { white-space: nowrap; font-size: 11px; }
.bulle .b-act small { color: var(--doux); font-weight: 500; }
.bulle.ouverte { max-width: 300px; z-index: 50; border-color: rgba(255,255,255,.55); }
.bulle.ouverte .b-tache { -webkit-line-clamp: 5; font-size: 11px; }
body.taches-off .bulle .b-tache { display: none; }
.bulle.claude { border-color: rgba(232,132,92,.6); }
.bulle.dort { color: var(--orange); }
.bulle.verdict { font-size: 13px; padding: 6px 12px; }
.etiquette { font: 700 10px "Space Grotesk", sans-serif; letter-spacing: .3em; color: rgba(255,255,255,.55); pointer-events: none; text-shadow: 0 0 12px rgba(0,0,0,.8); }
#info { position: fixed; z-index: 6; pointer-events: none; padding: 10px 12px; max-width: 380px; font-size: 12px; display: none; white-space: pre-wrap; overflow-wrap: anywhere; }
#info b { display: block; font-size: 13px; margin-bottom: 3px; }
#info .q { color: var(--doux); font-style: italic; }
.tiroir { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); z-index: 10; transform: translateX(105%); transition: transform .25s ease; display: flex; flex-direction: column; border-radius: 14px 0 0 14px; }
.tiroir.ouvert { transform: none; }
.tiroir .entete { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--bord); gap: 8px; flex-wrap: wrap; }
.tiroir button { background: rgba(255,255,255,.06); color: var(--texte); border: 1px solid var(--bord); border-radius: 8px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 12px; }
.tiroir button.choisi { background: var(--texte); color: #0b0c12; }
.tiroir pre { margin: 0; padding: 16px; overflow: auto; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 "JetBrains Mono", monospace; }
#t-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--bord); align-items: center; }
#t-actions:empty { display: none; }
#t-actions .note { color: var(--doux); font-size: 11px; }
.tiroir button.danger { border-color: rgba(255,107,107,.5); color: var(--rouge); }
.tiroir button.primaire, .modale button.primaire { background: var(--bleu); color: #0b0c12; border-color: var(--bleu); font-weight: 600; }
.formulaire { padding: 12px 16px; border-bottom: 1px solid var(--bord); display: grid; gap: 8px; }
.formulaire[hidden] { display: none; }
.formulaire label { font-size: 11px; color: var(--doux); display: grid; gap: 4px; }
.formulaire textarea, .formulaire input, .formulaire select { width: 100%; background: rgba(0,0,0,.35); color: var(--texte); border: 1px solid var(--bord); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 "JetBrains Mono", monospace; resize: vertical; }
.formulaire textarea { min-height: 90px; }
.formulaire .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.formulaire input[type=checkbox] { width: auto; margin: 0; }
.formulaire .confirme { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--texte); }
.formulaire .etat { font-size: 12px; color: var(--doux); }
.formulaire .etat.erreur { color: var(--rouge); }
.formulaire .etat.ok { color: var(--vert); }
.qr { padding: 12px 16px; overflow: auto; flex: 1; display: none; }
.qr.visible { display: block; }
.qr .item { border: 1px solid var(--bord); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: rgba(0,0,0,.2); }
.qr .q { font-weight: 600; margin-bottom: 6px; }
.qr .q small { color: var(--doux); font-weight: 400; margin-left: 6px; }
.qr .r { white-space: pre-wrap; font: 12px/1.55 "JetBrains Mono", monospace; color: #dfe3ee; }
.qr .attente { color: var(--orange); }
.modale { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(4,5,9,.55); }
.modale.ouverte { display: grid; }
.modale .carte { width: min(640px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow: auto; padding: 4px 0 8px; }
.modale h2 { margin: 0; padding: 14px 16px 6px; font-size: 15px; letter-spacing: .08em; }
.modale p { margin: 0; padding: 0 16px 6px; color: var(--doux); font-size: 12px; }
.modale button { background: rgba(255,255,255,.06); color: var(--texte); border: 1px solid var(--bord); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12px; }
#fil div[data-nom] { cursor: pointer; }
#fil div[data-nom]:hover { color: var(--texte); }
#chargement { position: fixed; inset: 0; display: grid; place-items: center; color: var(--doux); letter-spacing: .3em; font-size: 12px; z-index: 20; background: #07080d; transition: opacity .8s; }
@media (max-width: 760px) { #legende { display: none; } .kpi { min-width: 0; flex: 1; } #liens { margin-left: 0; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="chargement">CHARGEMENT DU BUREAU…</div>
<div id="hud">
  <div id="titre" class="verre"><h1>BUREAU DES AGENTS</h1><small id="maj">connexion…</small></div>
  <div class="kpi verre"><span>Codex</span><b id="k-codex">–</b></div>
  <div class="kpi verre"><span>Claude</span><b id="k-claude">–</b></div>
  <div class="kpi verre"><span>Places d'essais</span><b id="k-places">–</b></div>
  <div class="kpi verre"><span>Terminés 24 h</span><b id="k-jour">–</b></div>
  <div class="kpi verre"><span>Quota Codex</span><b id="k-quota">–</b></div>
  <div class="kpi verre" id="k-alim-c"><span>Alimentation</span><b id="k-alim">–</b></div>
  <div id="liens" class="verre"><button id="b-mission" title="Lancer un agent Codex (M)" hidden>＋ Mission</button><button id="b-taches" title="Afficher les tâches (L)">🏷 Tâches</button><button id="b-tour" title="Caméra automatique (T)">🎬 Tournage</button><button id="b-nuit" title="Jour / nuit (N)">🌙 Nuit</button><a href="/pixel">Pixel</a><a href="/tableau">Tableau →</a></div>
</div>
<div id="fil" class="verre"><div>En attente des premières nouvelles…</div></div>
<div id="legende" class="verre">
  <span><i style="color:#5b8cff;background:#5b8cff"></i>Production</span><span><i style="color:#a77bff;background:#a77bff"></i>Correction</span>
  <span><i style="color:#ffb347;background:#ffb347"></i>Revue</span><span><i style="color:#4ff0a0;background:#4ff0a0"></i>Intégration</span>
  <span><i style="color:#9aa1b8;background:#9aa1b8"></i>Diagnostic / analyse</span><span><i style="color:#e8845c;background:#e8845c"></i>Corps orange : Claude</span>
</div>
<div id="info" class="verre"></div>
<aside class="tiroir verre" id="tiroir">
  <div class="entete"><strong id="t-nom"></strong><span class="onglets"><button data-v="consigne">Consigne</button> <button data-v="rapport" class="choisi">Rapport</button> <button data-v="journal">Journal</button> <button data-v="questions">Questions</button></span><button id="t-fermer">Fermer</button></div>
  <div id="t-actions"></div>
  <form class="formulaire" id="f-question" hidden>
    <label>Question à une copie de l'agent (lecture seule ; l'agent lui-même n'est pas dérangé)
      <textarea name="question" placeholder="Où en es-tu ? Qu'est-ce qui te bloque ? Qu'as-tu modifié ?" required></textarea></label>
    <div class="ligne"><button class="primaire" type="submit">Envoyer la question</button><button type="button" data-annuler>Annuler</button><span class="etat"></span></div>
  </form>
  <form class="formulaire" id="f-suite" hidden>
    <label>Consigne de suite, envoyée dans la conversation de l'agent (il reprend avec toute sa mémoire, accès complet au dépôt)
      <textarea name="consigne" placeholder="Ex. : corrige le P1 relevé par la revue r5, puis relance verify et pousse ta branche." required></textarea></label>
    <label>Nom du nouveau travail<input name="nom" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,60}"></label>
    <div class="ligne"><label class="confirme"><input type="checkbox" name="ok" required> Je confirme le lancement</label></div>
    <div class="ligne"><button class="primaire" type="submit">Lancer la suite</button><button type="button" data-annuler>Annuler</button><span class="etat"></span></div>
  </form>
  <pre id="t-texte"></pre>
  <div class="qr" id="t-qr"></div>
</aside>
<div class="modale" id="modale-mission">
  <form class="carte verre formulaire" id="f-mission" style="border:0">
    <h2>NOUVELLE MISSION CODEX</h2>
    <p id="m-via"></p>
    <div class="ligne">
      <label style="flex:1">Rôle<select name="role"><option value="prod">Production</option><option value="correction">Correction</option><option value="revue">Revue</option><option value="int">Intégration</option><option value="diag">Diagnostic</option></select></label>
      <label style="flex:1">Lot<input name="lot" placeholder="B-180, hub-h1-4…" required></label>
      <label style="flex:1">Tour<input name="tour" type="number" min="1" placeholder="—"></label>
    </div>
    <label>Nom du travail (déduit, modifiable)<input name="nom" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,60}"></label>
    <label>Consigne complète<textarea name="consigne" style="min-height:200px" placeholder="Réponds en français. Dépôt : … Tâche : **…**" required></textarea></label>
    <div class="ligne"><label class="confirme"><input type="checkbox" name="ok" required> Je confirme le lancement (l'agent aura un accès complet au dépôt)</label></div>
    <div class="ligne"><button class="primaire" type="submit">Lancer la mission</button><button type="button" data-annuler>Annuler</button><span class="etat"></span></div>
  </form>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ================= Constantes =================
const JETON_PAGE = document.querySelector('meta[name=jeton]')?.content || '';
const ROLE = {
  production: { c: 0x5b8cff, nom: 'Production' }, correction: { c: 0xa77bff, nom: 'Correction' },
  revue: { c: 0xffb347, nom: 'Revue' }, integration: { c: 0x4ff0a0, nom: 'Intégration' },
  diagnostic: { c: 0x9aa1b8, nom: 'Diagnostic' }, analyse: { c: 0x9aa1b8, nom: 'Analyse' },
};
const CLAUDE = 0xe8845c, COULOIR = 2.6, PORTE = new THREE.Vector3(0, 0, 10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const duree = ms => { const m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };

// ================= Rendu =================
const hote = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
hote.appendChild(renderer.domElement);
const etiquettes = new CSS2DRenderer();
etiquettes.setSize(innerWidth, innerHeight);
Object.assign(etiquettes.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
hote.appendChild(etiquettes.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.fog = new THREE.Fog(0x07080d, 38, 70);

const vue = 13;
const asp = () => innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-vue * asp(), vue * asp(), vue, -vue, 0.1, 200);
const CAM_DEPART = new THREE.Vector3(22, 20, 24);
camera.position.copy(CAM_DEPART);
camera.zoom = innerWidth < 760 ? 0.7 : 0.95;
camera.updateProjectionMatrix();
const controles = new OrbitControls(camera, renderer.domElement);
controles.target.set(-1, 0.5, 0.3);
controles.enableDamping = true; controles.dampingFactor = 0.06;
controles.minPolarAngle = 0.35; controles.maxPolarAngle = 1.25;
controles.minZoom = 0.5; controles.maxZoom = 3.5;
controles.autoRotateSpeed = 0.35;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.45, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.left = -vue * asp(); camera.right = vue * asp(); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); etiquettes.setSize(innerWidth, innerHeight);
});

// ================= Lumières =================
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x2a1f18, 0.9);
scene.add(hemi);
const soleil = new THREE.DirectionalLight(0xfff1dc, 2.2);
soleil.position.set(-10, 18, 8);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
Object.assign(soleil.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 1, far: 50 });
soleil.shadow.bias = -0.0004; soleil.shadow.radius = 4;
scene.add(soleil);

// ================= Matériaux =================
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.05, ...o });
const MAT = {
  sol: M(0x1a1c26, { roughness: 0.32, metalness: 0.25 }), mur: M(0x252836, { roughness: 0.9 }), plinthe: M(0x14151d),
  bois: M(0x9a6b47, { roughness: 0.6 }), boisFonce: M(0x5e3f2b), metal: M(0x4a4f5e, { metalness: 0.7, roughness: 0.35 }),
  noir: M(0x101218, { roughness: 0.3, metalness: 0.4 }), blanc: M(0xe9ebf2, { roughness: 0.35 }), plante: M(0x2f8f5b), pot: M(0xd9d4c7),
  verreSombre: new THREE.MeshPhysicalMaterial({ color: 0x0b0d14, roughness: 0.08, metalness: 0.2, clearcoat: 1 }),
};
const lueur = (c, i = 2.2) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: c, emissiveIntensity: i, roughness: 0.4 });
function boite(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene, ombre = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = ombre; m.receiveShadow = true; parent.add(m); return m;
}
function texte3d(txt, x, y, z) { const d = document.createElement('div'); d.className = 'etiquette'; d.textContent = txt; const o = new CSS2DObject(d); o.position.set(x, y, z); scene.add(o); return o; }

// ================= Décor =================
// sol + dalles
const sol = new THREE.Mesh(new THREE.PlaneGeometry(26, 20), MAT.sol);
sol.rotation.x = -Math.PI / 2; sol.receiveShadow = true; scene.add(sol);
const grille = new THREE.GridHelper(26, 26, 0x2c3042, 0x22252f); grille.position.y = 0.002; grille.material.opacity = 0.5; grille.material.transparent = true; scene.add(grille);
// zones : tapis + liseré lumineux
const ZONES = [
  { x: -7.3, z: -3.6, w: 8.6, d: 7.6, c: 0x5b8cff, nom: 'ATELIER' },
  { x: 0.4, z: -3.6, w: 6.0, d: 7.6, c: 0xffb347, nom: 'SALLE DE REVUE' },
  { x: 7.9, z: -3.6, w: 7.6, d: 7.6, c: 0x4ff0a0, nom: 'INTÉGRATION' },
  { x: -6.5, z: 5.2, w: 7.5, d: 3.6, c: 0xe8845c, nom: 'SUPERVISION' },
];
const liseres = [];
for (const z of ZONES) {
  const t = boite(z.w, 0.02, z.d, M(new THREE.Color(z.c).multiplyScalar(0.12), { roughness: 0.9 }), z.x, 0.01, z.z, scene, false);
  const mat = lueur(z.c, 1.6); liseres.push(mat);
  for (const [w, d, dx, dz] of [[z.w, 0.05, 0, -z.d / 2], [z.w, 0.05, 0, z.d / 2], [0.05, z.d, -z.w / 2, 0], [0.05, z.d, z.w / 2, 0]]) boite(w, 0.03, d, mat, z.x + dx, 0.025, z.z + dz, scene, false);
  texte3d(z.nom, z.x - z.w / 2 + 0.3, 0.05, z.z + z.d / 2 - 0.35).element.style.transform = 'translate(0,-50%)';
}
// murs
boite(26, 4, 0.3, MAT.mur, 0, 2, -10);
boite(0.3, 4, 20, MAT.mur, -13, 2, 0);
boite(26, 0.2, 0.32, MAT.plinthe, 0, 0.1, -9.84, scene, false);
// fenêtres (mur gauche)
const vitres = [];
for (const z of [-6.5, -2, 2.5]) {
  boite(0.12, 2.2, 3, MAT.noir, -12.82, 2.3, z, scene, false);
  const v = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2), new THREE.MeshBasicMaterial({ color: 0x8cc8ff }));
  v.position.set(-12.75, 2.3, z); v.rotation.y = Math.PI / 2; scene.add(v); vitres.push(v);
  boite(0.14, 2, 0.06, MAT.noir, -12.74, 2.3, z, scene, false);
}
// mur du fond : grand écran + horloge

  fil.length = Math.min(fil.length, 8);

}
// Tâche raccourcie pour la bulle : retire la formule de rôle (« Relecteur indépendant du », « Agent producteur du »…).
function tacheCourte(j) {
  const t = (j.tache || '').replace(/^(?:agent\s+)?(?:producteur|relecteur(?:\s+ind[ée]pendant)?|correcteur|int[ée]grateur|analyste)\s+(?:de\s+l['’]|du |de la |des |de )?/i, '');
  return t ? t[0].toUpperCase() + t.slice(1) : j.titre || j.nom;
}
function verdictCourt(t) {
  const v = t.verdict || {};

  if (t.statut === 'interrompu') return { txt: 'interrompu', c: '#ff6b6b' };
  if (v.qualifie === false) return { txt: 'non qualifié', c: '#ffb347' };
  if (v.p0 != null || v.p1 != null) { const ok = (v.p0 || 0) + (v.p1 || 0) === 0; return { txt: `P0=${v.p0 ?? '?'} P1=${v.p1 ?? '?'}`, c: ok ? '#4ff0a0' : '#ffb347' }; }
  if (v.qualifie) return { txt: 'qualifié', c: '#4ff0a0' };
  return { txt: v.sha ? 'livré ' + v.sha : 'terminé', c: '#7ab8ff' };
}
function activite(t) {
  if (t.statut === 'silencieux') return ['💤', 'silencieux'];
  if (t.statut === 'attente') return ['⏸', 'attend le propriétaire'];
  const c = t.commande?.commande || '';
  if (/^(Read|Grep|Glob)\b/.test(c)) return ['🔎', 'lit le code'];
  if (/^(Edit|Write|NotebookEdit)\b/.test(c)) return ['✏️', 'modifie'];
  if (/^(WebFetch|WebSearch)\b/.test(c)) return ['🌐', 'recherche'];
  if (/^Agent\b/.test(c)) return ['🤝', 'délègue'];
  if (/^mcp__Claude_Browser/.test(c)) return ['🖥️', 'navigateur'];
  if (t.derniereMarque === 'codex') return ['💬', 'explique'];
  if (t.derniereMarque === 'apply patch') return ['✏️', 'modifie le code'];
  if (t.derniereMarque === 'tokens used') return ['📄', 'rédige le rapport'];
  if (/git (push|commit)/.test(c)) return ['⬆️', /push/.test(c) ? 'pousse' : 'commit'];
  if (/campaign-lock/.test(c)) return ['🧪', 'campagne d\'essais'];
  if (/\btest|vitest|jest|mutation|verify|playwright/.test(c)) return ['🧪', 'essais'];
  if (/docker|kubectl|colima|psql|pg_/.test(c)) return ['🐳', 'conteneurs'];
  if (/\bgit (diff|log|show|fetch|merge|rebase|worktree)/.test(c)) return ['🌿', 'git'];
  if (/(^|Bash )\s*(rg|grep|sed -n|cat|nl|head|tail|ls|find|wc|jq)\b/.test(c)) return ['🔎', 'lit le code'];
  return ['⚙️', 'travaille'];
}
function appliquer(s) {

  const vivants = s.travaux.filter(t => t.statut === 'actif' || t.statut === 'silencieux');
  const sessions = (s.sessions || []).slice(0, 4).map(x => ({ ...x, role: 'analyse', agent: 'claude', session: true }));
  const presents = new Map([...vivants, ...sessions].map(t => [t.nom, t]));
  for (const [nom, t] of presents) {
    let rb = robots.get(nom);
    if (!rb) {
      rb = new Robot(nom, t.agent === 'claude', t.role);
      rb.place = prendrePlace(t.session ? 'supervision' : zoneDe(t.role));
      if (premier || t.session) { rb.placer(rb.place); rb.mode = 'assis'; }
      else { rb.g.position.copy(PORTE); rb.mode = 'entre'; rb.aller([{ x: 0, z: COULOIR }, ...trajet({ x: 0, z: COULOIR }, null, rb.place)]); noter(`<b>${esc(t.titre || nom)}</b> arrive · ${(ROLE[t.role] || ROLE.analyse).nom.toLowerCase()}${t.agent === 'claude' ? ' · Claude' : ''}`); }
      robots.set(nom, rb);
    } else if (rb.job && rb.job.statut !== 'silencieux' && t.statut === 'silencieux') noter(`<b>${esc(t.titre || nom)}</b> n'écrit plus rien depuis ${duree(now - t.derniereEcriture)}`);
    rb.job = t;
  }
  for (const rb of robots.values()) {
    if (presents.has(rb.nom) || ['vers-imprimante', 'imprime', 'sort'].includes(rb.mode)) continue;
    if (rb.job?.session) { occupees.delete(rb.place); rb.detruire(); robots.delete(rb.nom); continue; }
    const fin = s.travaux.find(t => t.nom === rb.nom); if (fin) rb.job = fin;
    rb.verdict = verdictCourt(rb.job); rb.alerte = rb.verdict.c === '#ff6b6b';
    occupees.delete(rb.place);
    rb.aller(trajet(rb.g.position, rb.place, POSTE_IMPRIMANTE)); rb.mode = 'vers-imprimante';
    noter(`<b>${esc(rb.job.titre || rb.nom)}</b> a terminé : <span style="color:${rb.verdict.c}">${esc(rb.verdict.txt)}</span>`, new Date(), rb.nom);
  }
  if (premier) {
    fil.length = 0;
    s.travaux.filter(t => t.fin && now - t.fin < 12 * 3600000).sort((a, b) => a.fin - b.fin).slice(-6).forEach(t => { const v = verdictCourt(t); noter(`<b>${esc(t.titre || t.nom)}</b> terminé : <span style="color:${v.c}">${esc(v.txt)}</span>`, new Date(t.fin), t.nom); });

  }

  // HUD
  const occ = s.places.filter(p => p.vivant).length, bt = s.machine.batterie;
  document.getElementById('k-codex').textContent = vivants.filter(t => t.agent !== 'claude').length;
  document.getElementById('k-claude').textContent = `${vivants.filter(t => t.agent === 'claude').length} + ${sessions.filter(x => x.statut === 'actif').length}`;
  document.getElementById('k-places').textContent = `${occ} / ${s.placesMax}`;
  document.getElementById('k-jour').textContent = s.travaux.filter(t => t.fin && now - t.fin < 86400000).length;
  document.getElementById('k-quota').textContent = s.quota ? s.quota.restant + ' %' : '–';
  document.getElementById('k-alim').textContent = bt ? (bt.secteur ? 'Secteur' : `🔋 ${bt.pourcent} %`) : '–';

// ================= Bulles sans chevauchement =================
// Chaque bulle part au-dessus de son robot ; si elle touche une bulle déjà placée, elle monte
// (ou glisse de côté si c'est plus court). Une tige la relie à son robot.
const v3 = new THREE.Vector3();
let tailleTache = null;
function placerBulles() {
  const W = innerWidth, H = innerHeight, ECART = 5;
  const liste = [];
  for (const rb of robots.values()) {
    if (!rb.g.visible || rb.alpha <= 0) continue;
    rb.bulle.getWorldPosition(v3); v3.project(camera);
    if (v3.z > 1) continue;
    if (!rb.mesure || rb._tt !== document.body.classList.contains('taches-off')) {
      rb._tt = document.body.classList.contains('taches-off');
      rb.mesure = { w: rb.bulleEl.offsetWidth, h: rb.bulleEl.offsetHeight };
      if (!rb.mesure.w) { rb.mesure = null; continue; } // pas encore dans la page : on mesurera à l'image suivante
    }
    liste.push({ rb, x: (v3.x + 1) / 2 * W, y: (1 - v3.y) / 2 * H, w: rb.mesure.w, h: rb.mesure.h });
  }
  // les plus proches de la caméra (plus bas à l'écran) d'abord ; la bulle survolée passe en premier
  liste.sort((a, b) => (b.rb.survol - a.rb.survol) || (b.y - a.y));
  const places = [];
  const touche = (a, b) => a.l < b.r + ECART && a.r > b.l - ECART && a.t < b.b + ECART && a.b > b.t - ECART;
  for (const it of liste) {
    let dx = 0, dy = 0;
    const boite = () => ({ l: it.x - it.w / 2 + dx, r: it.x + it.w / 2 + dx, b: it.y - 6 - dy, t: it.y - 6 - dy - it.h });
    for (let essai = 0; essai < 30; essai++) {
      const bx = boite(), gene = places.find(p => touche(bx, p));
      if (!gene) break;
      const monter = bx.b - (gene.t - ECART);
      const gauche = bx.r - (gene.l - ECART), droite = (gene.r + ECART) - bx.l;
      const lateral = Math.min(gauche, droite);
      if (lateral < monter * 0.6 && Math.abs(dx) + lateral < 90) dx += gauche < droite ? -gauche : droite;
      else dy += monter;
    }
    const bx = boite();
    if (bx.l < 8) dx += 8 - bx.l; if (bx.r > W - 8) dx -= bx.r - (W - 8);
    places.push(boite());
    const rb = it.rb;
    rb.decalage += (dy - rb.decalage) * 0.25; rb.decalageX += (dx - rb.decalageX) * 0.25;
    rb.bulleEl.style.transform = `translate(calc(-50% + ${rb.decalageX.toFixed(1)}px), ${(-rb.decalage).toFixed(1)}px)`;
    const haut = rb.decalage + 6;
    rb.tigeEl.style.height = (rb.decalage > 3 || Math.abs(rb.decalageX) > it.w / 2 ? haut : 0) + 'px';
    rb.tigeEl.style.transform = Math.abs(rb.decalageX) > 2 ? `skewX(${(-Math.atan2(rb.decalageX, haut) * 180 / Math.PI).toFixed(1)}deg)` : '';
    rb.tigeEl.style.transformOrigin = 'bottom';
    rb.bulle.element.style.setProperty('--point', rb.decalage > 3 ? 1 : 0);
  }
}

const ray = new THREE.Raycaster(), souris = new THREE.Vector2(), info = document.getElementById('info');
let survole = null;
function robotSous(e) {
  souris.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(souris, camera);
  const objets = []; robots.forEach(r => r.g.traverse(o => o.isMesh && o !== r.halo && objets.push(o)));
  return ray.intersectObjects(objets, false)[0]?.object.userData.robot || null;
}

  survole = rb; renderer.domElement.style.cursor = rb ? 'pointer' : 'grab';
  if (!rb) { info.style.display = 'none'; return; }

  const j = rb.job || {}, now = donnees.genereA;
  const type = j.session ? 'Session Claude (superviseur)' : `${(ROLE[j.role] || ROLE.analyse).nom}${j.tour ? ' · tour ' + j.tour : ''} · lot ${esc(j.lot)} · ${j.agent === 'claude' ? 'Claude' : 'Codex ' + (j.modele || '')}`;
  info.innerHTML = `<b>${esc(j.tache || j.titre || j.nom)}</b>${esc(j.nom.startsWith('session:') || j.nom.startsWith('claude:') ? (j.titre || '') + (j.projet ? ' · ' + j.projet : '') : j.nom)}\n${type}\n` +
    (rb.verdict ? `Terminé : <span style="color:${rb.verdict.c}">${esc(rb.verdict.txt)}</span>\n` : j.session ? `${j.statut === 'actif' ? 'Au travail' : 'Attend le propriétaire'} · dernière activité il y a ${duree(now - j.derniereEcriture)}\n` : `Au travail depuis ${duree(now - j.debut)} · dernière activité il y a ${duree(now - j.derniereEcriture)}\n`) +
    (j.tacheDetail ? `\n<span class="q">${esc(j.tacheDetail.slice(0, 280))}${j.tacheDetail.length > 280 ? '…' : ''}</span>\n` : '') +
    (j.message ? `\nDernier message : « ${esc(j.message.slice(0, 300))}${j.message.length > 300 ? '…' : ''} »` : '') +
    (j.commande ? `\n\n▸ ${esc(j.commande.commande.slice(0, 140))}` : '');
  info.style.display = 'block';
  const x = e.clientX + 18 + 380 > innerWidth ? e.clientX - 398 : e.clientX + 18;
  info.style.left = Math.max(8, x) + 'px'; info.style.top = Math.min(e.clientY + 18, innerHeight - info.offsetHeight - 8) + 'px';
});
renderer.domElement.addEventListener('click', e => { const rb = robotSous(e); if (rb) ouvrir(rb.nom); });
renderer.domElement.addEventListener('dblclick', () => { controles.autoRotate = false; camera.position.copy(CAM_DEPART); controles.target.set(-1, 0.5, 0.3); camera.zoom = innerWidth < 760 ? 0.7 : 0.95; camera.updateProjectionMatrix(); });
const basculeTour = () => { controles.autoRotate = !controles.autoRotate; document.getElementById('b-tour').style.opacity = controles.autoRotate ? 1 : ''; };
const basculeNuit = () => { nuitForcee = nuitForcee == null ? !nuitAuto() : null; ambiance(); };
document.getElementById('b-tour').onclick = basculeTour;
document.getElementById('b-nuit').onclick = basculeNuit;
const basculeTaches = () => { document.body.classList.toggle('taches-off'); document.getElementById('b-taches').style.opacity = document.body.classList.contains('taches-off') ? .45 : ''; };
document.getElementById('b-taches').onclick = basculeTaches;
addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) { if (e.key === 'Escape') document.activeElement.blur(); return; } if (e.key === 'l' || e.key === 'L') basculeTaches(); if (e.key === 't' || e.key === 'T') basculeTour(); if (e.key === 'n' || e.key === 'N') basculeNuit(); if (e.key === 'Escape') fermer(); });

let tiroirNom = null, tiroirVue = 'rapport', minuterieQR = null;
const $ = id => document.getElementById(id);
const JETON = document.querySelector('meta[name=jeton]')?.content || '';
async function poster(chemin, donneesEnvoyees) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'content-type': 'application/json', 'x-bureau-jeton': JETON }, body: JSON.stringify(donneesEnvoyees) });
  const j = await r.json().catch(() => ({ erreur: `réponse illisible (${r.status})` }));
  if (!r.ok || j.erreur) throw new Error(j.erreur || r.status);
  return j;
}
const travailDe = nom => robots.get(nom)?.job || donnees?.travaux.find(t => t.nom === nom) || donnees?.sessions?.find(t => t.nom === nom);
const estCodex = j => j && !j.session && j.agent !== 'claude' && !/^(session|claude):/.test(j.nom);
const enCours = j => j && (j.statut === 'actif' || j.statut === 'silencieux');

async function chargerTiroir() {
  clearInterval(minuterieQR);
  const pre = $('t-texte'), qr = $('t-qr');
  if (tiroirVue === 'questions') {
    pre.style.display = 'none'; qr.classList.add('visible');
    await chargerQuestions(); minuterieQR = setInterval(chargerQuestions, 3000);
    return;
  }
  pre.style.display = ''; qr.classList.remove('visible');
  const r = await fetch(`/api/${tiroirVue}?nom=${encodeURIComponent(tiroirNom)}`);
  pre.textContent = (await r.text()) || 'Rien à afficher.'; pre.scrollTop = tiroirVue === 'journal' ? 1e9 : 0;
}
async function chargerQuestions() {
  if (!tiroirNom) return;
  const liste = await (await fetch(`/api/questions?nom=${encodeURIComponent(tiroirNom)}`, { cache: 'no-store' })).json();
  $('t-qr').innerHTML = liste.length ? liste.map(q => `<div class="item"><div class="q">❓ ${esc(q.question)}<small>${new Date(q.debut).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })} · ${q.etat === 'en cours' ? 'la copie réfléchit… ' + duree(Date.now() - q.debut) : q.etat === 'repondu' ? 'répondu' : 'échec'}</small></div>` +
    (q.reponse?.trim() ? `<div class="r">${esc(q.reponse.trim())}</div>` : q.etat === 'en cours' ? '<div class="r attente">⏳ La copie de l\'agent recharge son contexte puis répond (souvent 30 s à quelques minutes).</div>' : '<div class="r">Pas de réponse.</div>') + '</div>').join('')
    : '<div class="r" style="color:var(--doux)">Aucune question posée à cet agent depuis le démarrage du serveur.</div>';
  if (!liste.some(q => q.etat === 'en cours')) clearInterval(minuterieQR);
}
function choisirVue(v) {
  tiroirVue = v;
  document.querySelectorAll('.onglets button').forEach(x => x.classList.toggle('choisi', x.dataset.v === v));
  chargerTiroir();
}
function boutonsActions(j) {
  const zone = $('t-actions'); zone.innerHTML = '';
  if (!donnees?.actions || !JETON) { zone.innerHTML = '<span class="note">Actions désactivées sur ce poste (lecture seule).</span>'; return; }
  const b = (txt, cls, fn, titre = '') => { const e = document.createElement('button'); e.type = 'button'; e.textContent = txt; e.className = cls; e.title = titre; e.onclick = fn; zone.appendChild(e); };
  const peutQuestion = j?.session || (estCodex(j) && j.aSession);
  if (peutQuestion) b('💬 Poser une question', '', () => montrer('f-question'), "Une copie de l'agent répond ; l'agent n'est pas dérangé");
  if (estCodex(j) && j.aSession && !enCours(j)) b('↪ Consigne de suite', '', () => { montrer('f-suite'); $('f-suite').nom.value = nomSuite(j.nom); }, 'Reprend sa conversation avec une nouvelle instruction');
  if (estCodex(j) && enCours(j)) b('⏹ Arrêter', 'danger', () => arreterAgent(j.nom), 'Arrêt normal (SIGTERM), jamais forcé');
  if (j?.agent === 'claude' && !j.session) zone.insertAdjacentHTML('beforeend', '<span class="note">Sous-agent Claude : interrogez plutôt sa session parente.</span>');
  if (estCodex(j) && !j.aSession) zone.insertAdjacentHTML('beforeend', '<span class="note">Identifiant de session Codex absent du journal : ni question ni suite possibles.</span>');
}
function nomSuite(nom) { const base = nom.replace(/-suite\d+$/, ''); let i = 1; while (donnees?.travaux.some(t => t.nom === `${base}-suite${i}`)) i++; return `${base}-suite${i}`; }
function montrer(id) {
  for (const f of ['f-question', 'f-suite']) $(f).hidden = f !== id;
  const f = $(id); f.querySelector('.etat').textContent = ''; f.querySelector('textarea').focus();
}
function cacherFormulaires() { $('f-question').hidden = true; $('f-suite').hidden = true; }
function ouvrir(nom) {
  const j = travailDe(nom);
  tiroirNom = nom; $('t-nom').textContent = j?.tache || j?.titre || nom; $('tiroir').classList.add('ouvert');
  cacherFormulaires(); boutonsActions(j);
  choisirVue(j && !j.aRapport && !j.session ? 'journal' : 'rapport');
}
function fermer() { $('tiroir').classList.remove('ouvert'); tiroirNom = null; clearInterval(minuterieQR); fermerMission(); }
$('t-fermer').onclick = fermer;
document.querySelector('.onglets').addEventListener('click', e => { const o = e.target.closest('button'); if (o) choisirVue(o.dataset.v); });
document.querySelectorAll('[data-annuler]').forEach(b => b.onclick = () => { cacherFormulaires(); fermerMission(); });
$('fil').addEventListener('click', e => { const d = e.target.closest('[data-nom]'); if (d && travailDe(d.dataset.nom)) ouvrir(d.dataset.nom); });

async function soumettre(form, envoi, succes) {
  const etat = form.querySelector('.etat'), bouton = form.querySelector('button[type=submit]');
  etat.className = 'etat'; etat.textContent = 'Envoi…'; bouton.disabled = true;
  try { const r = await envoi(); etat.className = 'etat ok'; etat.textContent = succes(r); return r; }
  catch (err) { etat.className = 'etat erreur'; etat.textContent = '✖ ' + err.message; }
  finally { bouton.disabled = false; }
}
$('f-question').addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, nom = tiroirNom;
  const r = await soumettre(f, () => poster('/api/action/question', { nom, question: f.question.value }), () => 'Question envoyée : la réponse arrive dans l\'onglet Questions.');
  if (r) { f.question.value = ''; noter(`💬 Question envoyée à <b>${esc(travailDe(nom)?.titre || nom)}</b>`); setTimeout(() => { cacherFormulaires(); choisirVue('questions'); }, 700); }
});
$('f-suite').addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, source = tiroirNom;
  const r = await soumettre(f, () => poster('/api/action/suite', { source, nom: f.nom.value, consigne: f.consigne.value }), r => `Lancé : ${r.nom}. Le robot arrive par la porte.`);
  if (r) { f.consigne.value = ''; f.ok.checked = false; noter(`↪ Suite lancée pour <b>${esc(source)}</b> : ${esc(r.nom)}`); }
});
async function arreterAgent(nom) {
  if (!confirm(`Arrêter ${nom} ?\n\nArrêt normal (SIGTERM) de l'agent et de ses commandes ; sa place d'essais est libérée. Le travail en cours est perdu.`)) return;
  try { const r = await poster('/api/action/arret', { nom }); noter(`⏹ Arrêt demandé pour <b>${esc(nom)}</b> (${r.signales} processus)`); $('t-actions').insertAdjacentHTML('beforeend', '<span class="note">Arrêt envoyé.</span>'); }
  catch (err) { alert('Arrêt impossible : ' + err.message); }
}
// ----- Nouvelle mission -----
const fm = $('f-mission');
function nomMission() {
  const lot = fm.lot.value.trim().replace(/\s+/g, '-'), tour = fm.tour.value ? `-r${fm.tour.value}` : '';
  if (!lot) return '';
  return { prod: `prod-${lot}${tour}`, correction: `${lot}-correction${tour}`, revue: `${lot}-revue${tour}`, int: `int-${lot}${tour}`, diag: `diag-${lot}${tour}` }[fm.role.value];
}
['role', 'lot', 'tour'].forEach(k => fm[k].addEventListener('input', () => { fm.nom.value = nomMission(); }));
function ouvrirMission() {
  $('m-via').textContent = donnees?.codexRun ? 'Lancée par le script de lancement du poste (codex-run.sh : quota, veille, modèle de repli).' : 'Lancée par le lanceur intégré (lanceur.sh), dans le dossier de travail configuré.';
  fm.querySelector('.etat').textContent = ''; $('modale-mission').classList.add('ouverte'); fm.lot.focus();
}
function fermerMission() { $('modale-mission').classList.remove('ouverte'); }
$('b-mission').onclick = ouvrirMission;
$('modale-mission').addEventListener('click', e => { if (e.target.id === 'modale-mission') fermerMission(); });
fm.addEventListener('submit', async e => {
  e.preventDefault();
  const r = await soumettre(fm, () => poster('/api/action/mission', { nom: fm.nom.value, consigne: fm.consigne.value }), r => `Lancée : ${r.nom}. Le robot arrive par la porte.`);
  if (r) { noter(`＋ Mission lancée : <b>${esc(r.nom)}</b>`); fm.reset(); setTimeout(fermerMission, 1200); }
});
addEventListener('keydown', e => { if ((e.key === 'm' || e.key === 'M') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('b-mission').hidden) ouvrirMission(); });

async function boucle() {
  try { appliquer(await (await fetch('/api/etat', { cache: 'no-store' })).json()); }
  catch (e) { document.getElementById('maj').textContent = 'serveur injoignable — nouvel essai…'; console.error(e); }
  setTimeout(boucle, 4000);
}
dessinerEcran(); dessinerHorloge(); ambiance(); boucle();
window.__bureau = { robots, appliquer, ouvrir, get donnees() { return donnees; } };
</script>
